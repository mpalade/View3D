<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>View3D</title><style>html,body{margin:0;height:100%;background:#05070a;color:#fff;font-family:system-ui;overflow:hidden}body{display:grid;place-items:center}.c{width:100%;height:100%;display:flex;flex-direction:column;align-items:center}.top{width:min(94vw,560px);padding:14px;box-sizing:border-box;text-align:center;z-index:3}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button{padding:12px 16px;border:0;border-radius:12px;font-weight:700}.stage{position:relative;width:min(94vw,560px);flex:1;min-height:0;margin-bottom:14px;border-radius:18px;overflow:hidden;background:#111}video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}.mirror{transform:scaleX(-1)}#overlay{position:absolute;inset:0;pointer-events:none;display:none;align-items:center;justify-content:center;perspective:700px}#cube{width:96px;height:96px;position:relative;transform-style:preserve-3d;animation:r 4s linear infinite}.face{position:absolute;width:96px;height:96px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.95);box-shadow:inset 0 0 22px rgba(255,255,255,.12)}.f{transform:translateZ(48px)}.b{transform:rotateY(180deg) translateZ(48px)}.r{transform:rotateY(90deg) translateZ(48px)}.l{transform:rotateY(-90deg) translateZ(48px)}.t{transform:rotateX(90deg) translateZ(48px)}.bt{transform:rotateX(-90deg) translateZ(48px)}@keyframes r{to{transform:rotateX(360deg) rotateY(360deg)}}#guide{position:absolute;left:50%;top:50%;width:55%;aspect-ratio:1.35;transform:translate(-50%,-50%);border:2px dashed rgba(255,255,255,.65);border-radius:16px;pointer-events:none}#s{margin:8px 0 10px;font-size:14px}</style></head><body><div class="c"><div class="top"><h1 style="margin:0 0 8px">View3D</h1><p id="s">Camera oprită</p><div class="controls"><button id="b">Pornește camera</button><button id="sw" disabled>Schimbă camera</button></div></div><div class="stage"><video id="v" autoplay muted playsinline></video><div id="guide"></div><div id="overlay"><div id="cube"><div class="face f"></div><div class="face b"></div><div class="face r"></div><div class="face l"></div><div class="face t"></div><div class="face bt"></div></div></div></div></div><canvas id="cv" width="160" height="120" hidden></canvas><script>const v=document.getElementById('v'),b=document.getElementById('b'),sw=document.getElementById('sw'),s=document.getElementById('s'),cv=document.getElementById('cv'),x=cv.getContext('2d',{willReadFrequently:true}),overlay=document.getElementById('overlay');let st=null,on=false,cnt=0,pm=null,facing='environment';async function openCamera(){if(st)st.getTracks().forEach(t=>t.stop());cnt=0;pm=null;try{st=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}}});v.srcObject=st;v.classList.toggle('mirror',facing==='user');await v.play();on=true;b.textContent='Oprește';sw.disabled=false;s.textContent=(facing==='environment'?'Camera principală':'Camera frontală')+' — caut o suprafață…';tick()}catch(e){on=false;sw.disabled=true;s.textContent='Eroare: '+e.message}}function stop(){on=false;if(st)st.getTracks().forEach(t=>t.stop());st=null;v.srcObject=null;overlay.style.display='none';sw.disabled=true;b.textContent='Pornește camera';s.textContent='Camera oprită'}b.onclick=()=>on?stop():openCamera();sw.onclick=async()=>{facing=facing==='environment'?'user':'environment';await openCamera()};function tick(){if(!on)return;if(v.readyState<2){requestAnimationFrame(tick);return}x.save();if(facing==='user'){x.translate(160,0);x.scale(-1,1)}x.drawImage(v,0,0,160,120);x.restore();const d=x.getImageData(35,30,90,60).data;let sum=0,sum2=0,n=0;for(let i=0;i<d.length;i+=16){const l=.299*d[i]+.587*d[i+1]+.114*d[i+2];sum+=l;sum2+=l*l;n++}const m=sum/n,vr=Math.max(0,sum2/n-m*m),motion=pm==null?0:Math.abs(m-pm);pm=m;const score=Math.min(1,vr/1600)*(1-Math.min(.7,motion/40));if(score>.42)cnt++;else cnt=Math.max(0,cnt-2);if(cnt>7){overlay.style.display='flex';s.textContent=(facing==='environment'?'Camera principală':'Camera frontală')+' — suprafață detectată'}else{overlay.style.display='none';s.textContent=(facing==='environment'?'Camera principală':'Camera frontală')+' — caut o suprafață…'}setTimeout(tick,100)}</script></body></html>
