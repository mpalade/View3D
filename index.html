<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>View3D</title><style>html,body{margin:0;height:100%;background:#05070a;color:#fff;font-family:system-ui}body{display:grid;place-items:center}.c{text-align:center;padding:24px}button{padding:14px 18px;border:0;border-radius:12px;font-weight:700}video{width:min(92vw,520px);max-height:65vh;border-radius:16px;background:#111;transform:scaleX(-1);margin-top:16px}#box{display:none;width:90px;height:90px;margin:24px auto 0;transform-style:preserve-3d;animation:r 4s linear infinite;background:rgba(255,255,255,.15);border:2px solid #fff}@keyframes r{to{transform:rotateX(360deg) rotateY(360deg)}}</style></head><body><div class="c"><h1>View3D</h1><p id="s">Camera oprită</p><button id="b">Pornește camera</button><br><video id="v" autoplay muted playsinline></video><div id="box"></div></div><canvas id="cv" width="160" height="120" hidden></canvas><script>const v=document.getElementById('v'),b=document.getElementById('b'),s=document.getElementById('s'),cv=document.getElementById('cv'),x=cv.getContext('2d',{willReadFrequently:true}),box=document.getElementById('box');let st=null,on=false,cnt=0,pm=null;async function start(){try{st=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'user'}}});v.srcObject=st;await v.play();on=true;b.textContent='Oprește';s.textContent='Caut o suprafață…';tick()}catch(e){s.textContent='Eroare: '+e.message}}function stop(){on=false;if(st)st.getTracks().forEach(t=>t.stop());v.srcObject=null;box.style.display='none';b.textContent='Pornește camera';s.textContent='Camera oprită'}b.onclick=()=>on?stop():start();function tick(){if(!on)return;if(v.readyState<2){requestAnimationFrame(tick);return}x.drawImage(v,0,0,160,120);const d=x.getImageData(35,30,90,60).data;let sum=0,sum2=0,n=0;for(let i=0;i<d.length;i+=16){const l=.299*d[i]+.587*d[i+1]+.114*d[i+2];sum+=l;sum2+=l*l;n++}const m=sum/n,vr=Math.max(0,sum2/n-m*m),motion=pm==null?0:Math.abs(m-pm);pm=m;const score=Math.min(1,vr/1600)*(1-Math.min(.7,motion/40));if(score>.42)cnt++;else cnt=Math.max(0,cnt-2);if(cnt>7){box.style.display='block';s.textContent='Suprafață detectată — obiect 3D activ'}else{box.style.display='none';s.textContent='Caut o suprafață…'}setTimeout(tick,100)}</script></body></html>
