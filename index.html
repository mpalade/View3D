<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>View3D – Robust Paper + Polygon Arrows</title>
<style>
html,body{margin:0;background:#07090d;color:#fff;font-family:system-ui,Segoe UI,sans-serif}body{min-height:100vh}.app{max-width:760px;margin:auto;padding:12px;box-sizing:border-box}.top{position:sticky;top:0;z-index:5;background:rgba(7,9,13,.94);padding:8px 0 10px}.title{display:flex;justify-content:space-between;align-items:center}.title h1{font-size:20px;margin:0}.ver{font-size:12px;opacity:.65}.status{font-size:13px;margin:7px 0}.controls{display:flex;gap:8px}button{padding:10px 13px;border:0;border-radius:11px;font-weight:700}.stage{position:relative;width:100%;aspect-ratio:3/4;background:#111;border-radius:16px;overflow:hidden}.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%}video{object-fit:fill}.mirror{transform:scaleX(-1)}.hint{position:absolute;left:50%;top:50%;width:72%;height:80%;transform:translate(-50%,-50%);border:2px dashed #ffffff99;border-radius:8px;pointer-events:none}.hint:after{content:'A4';position:absolute;right:8px;top:6px;font-weight:800}.paper-ok .hint{display:none}.panel{margin-top:12px;background:#121722;border:1px solid #ffffff18;border-radius:14px;padding:12px}.panel h2{font-size:16px;margin:0 0 8px}.objects{display:grid;gap:7px}.obj{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;background:#0b0f16;border-radius:9px;font-size:13px}.muted{opacity:.68}.geo{outline:1px solid #00ff9d33}.mil{outline:1px solid #ff4fd855}.corr{outline:1px solid #4da3ff66}.debug{font-size:11px;opacity:.62;margin-top:3px}
</style>
</head>
<body><div class="app" id="app">
<div class="top"><div class="title"><h1>View3D · Robust Paper + Arrows</h1><span class="ver">v10</span></div><div class="status" id="status">Se încarcă OpenCV…</div><div class="controls"><button id="start" disabled>Pornește camera</button><button id="switch" disabled>Schimbă camera</button></div></div>
<div class="stage" id="stage"><video id="video" autoplay muted playsinline></video><canvas id="overlay"></canvas><div class="hint"></div></div><canvas id="work" hidden></canvas>
<div class="panel"><h2>1. Forme geometrice <span id="gcount" class="muted">(0)</span></h2><div id="geometry" class="objects"><div class="muted">Nicio formă detectată.</div></div></div>
<div class="panel"><h2>2. Simboluri militare <span id="mcount" class="muted">(0)</span></h2><div id="military" class="objects"><div class="muted">Niciun simbol militar detectat.</div></div></div>
<div class="panel"><h2>3. Coridoare / culoare <span id="ccount" class="muted">(0)</span></h2><div id="corridors" class="objects"><div class="muted">Niciun coridor detectat.</div></div><div class="debug">Săgeată deschisă: țintă 6 segmente. Săgeată închisă/poligon: țintă 7 segmente.</div></div>
</div>
<script async src="https://docs.opencv.org/4.x/opencv.js" onload="opencvLoaded()"></script>
<script>
const video=document.getElementById('video'),overlay=document.getElementById('overlay'),octx=overlay.getContext('2d'),work=document.getElementById('work'),wctx=work.getContext('2d',{willReadFrequently:true});
const startBtn=document.getElementById('start'),switchBtn=document.getElementById('switch'),statusEl=document.getElementById('status'),geometryEl=document.getElementById('geometry'),militaryEl=document.getElementById('military'),corridorsEl=document.getElementById('corridors'),gcount=document.getElementById('gcount'),mcount=document.getElementById('mcount'),ccount=document.getElementById('ccount'),app=document.getElementById('app'),stage=document.getElementById('stage');
let stream=null,running=false,facing='environment',cvReady=false,busy=false,lastRun=0,gen=0,lastPaper=null,paperHold=0;
function opencvLoaded(){const r=()=>{if(window.cv&&cv.Mat){cvReady=true;startBtn.disabled=false;statusEl.textContent='Pregătit. Încadrează foaia A4.'}else setTimeout(r,100)};r()}
function cname(){return facing==='environment'?'Camera principală':'Camera frontală'}
async function openCamera(){const g=++gen;running=false;if(stream)stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}}});video.srcObject=stream;video.classList.toggle('mirror',facing==='user');await video.play();if(g!==gen)return;running=true;startBtn.textContent='Oprește';switchBtn.disabled=false;resize();requestAnimationFrame(loop)}catch(e){statusEl.textContent='Eroare cameră: '+e.message}}
function stopCamera(){++gen;running=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;startBtn.textContent='Pornește camera';switchBtn.disabled=true;octx.clearRect(0,0,overlay.width,overlay.height);renderAll([],[],[])}
startBtn.onclick=()=>running?stopCamera():openCamera();switchBtn.onclick=()=>{facing=facing==='environment'?'user':'environment';openCamera()};
function resize(){const W=video.videoWidth||720,H=video.videoHeight||1280;stage.style.aspectRatio=W+'/'+H;overlay.width=work.width=W;overlay.height=work.height=H}
function mpts(m){const a=[];for(let i=0;i<m.rows;i++)a.push({x:m.intAt(i,0),y:m.intAt(i,1)});return a}
function orderQuad(pts){const s=pts.map(p=>p.x+p.y),d=pts.map(p=>p.x-p.y);return [pts[s.indexOf(Math.min(...s))],pts[d.indexOf(Math.max(...d))],pts[s.indexOf(Math.max(...s))],pts[d.indexOf(Math.min(...d))]]}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function quadScore(q,W,H,area){const p=orderQuad(q),w=(dist(p[0],p[1])+dist(p[3],p[2]))/2,h=(dist(p[0],p[3])+dist(p[1],p[2]))/2,ratio=Math.max(w/h,h/w),ratioScore=Math.max(0,1-Math.abs(ratio-1.414)/.55),areaScore=Math.min(1,area/(W*H*.55)),cx=p.reduce((s,x)=>s+x.x,0)/4,cy=p.reduce((s,x)=>s+x.y,0)/4,centerScore=1-Math.min(1,Math.hypot(cx-W/2,cy-H/2)/Math.hypot(W/2,H/2));return .55*areaScore+.30*ratioScore+.15*centerScore}
function contoursToPaper(mask,W,H,method){const cs=new cv.MatVector(),hi=new cv.Mat();cv.findContours(mask,cs,hi,cv.RETR_EXTERNAL,cv.CHAIN_APPROX_SIMPLE);let best=null,bestScore=0;for(let i=0;i<cs.size();i++){const c=cs.get(i),area=Math.abs(cv.contourArea(c));if(area>W*H*.08&&area<W*H*.98){const per=cv.arcLength(c,true);for(const eps of [.015,.025,.04,.06]){const ap=new cv.Mat();cv.approxPolyDP(c,ap,eps*per,true);if(ap.rows===4&&cv.isContourConvex(ap)){const q=mpts(ap),sc=quadScore(q,W,H,area);if(sc>bestScore){best={q:orderQuad(q),score:sc,method};bestScore=sc}}ap.delete()}}c.delete()}cs.delete();hi.delete();return best}
function findPaper(gray,edges,W,H){const e=contoursToPaper(edges,W,H,'edge'),bright=new cv.Mat(),smooth=new cv.Mat();cv.GaussianBlur(gray,smooth,new cv.Size(9,9),0);cv.threshold(smooth,bright,0,255,cv.THRESH_BINARY+cv.THRESH_OTSU);const k=cv.getStructuringElement(cv.MORPH_RECT,new cv.Size(11,11));cv.morphologyEx(bright,bright,cv.MORPH_CLOSE,k);k.delete();const b=contoursToPaper(bright,W,H,'white');bright.delete();smooth.delete();const best=!e?b:!b?e:(e.score>=b.score?e:b);if(best&&best.score>.34){lastPaper=best.q;paperHold=5;return best}if(lastPaper&&paperHold>0){paperHold--;return {q:lastPaper,score:.30,method:'hold'}}lastPaper=null;return null}
function project(x,y,H){const s=cv.matFromArray(1,1,cv.CV_32FC2,[x,y]),d=new cv.Mat();cv.perspectiveTransform(s,d,H);const p={x:d.floatAt(0,0),y:d.floatAt(0,1)};s.delete();d.delete();return p}
function drawPath(points,label,color,closed=true){if(points.length<2)return;octx.save();octx.strokeStyle=color;octx.fillStyle=color;octx.lineWidth=Math.max(2,overlay.width/360);octx.beginPath();octx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)octx.lineTo(points[i].x,points[i].y);if(closed)octx.closePath();octx.stroke();if(label){const p=points[0];octx.font=`700 ${Math.max(13,overlay.width/48)}px system-ui`;octx.fillText(label,p.x+5,p.y-6)}octx.restore()}
function renderAll(g,m,c){gcount.textContent=`(${g.length})`;mcount.textContent=`(${m.length})`;ccount.textContent=`(${c.length})`;geometryEl.innerHTML=g.length?g.map((o,i)=>`<div class="obj geo"><span><b>G${i+1}. ${o.type}</b></span><span class="muted">${Math.round(o.conf*100)}%</span></div>`).join(''):'<div class="muted">Nicio formă detectată.</div>';militaryEl.innerHTML=m.length?m.map((o,i)=>`<div class="obj mil"><span><b>M${i+1}. ${o.type}</b><div class="debug">${o.debug||''}</div></span><span class="muted">${Math.round(o.conf*100)}%</span></div>`).join(''):'<div class="muted">Niciun simbol militar detectat.</div>';corridorsEl.innerHTML=c.length?c.map((o,i)=>`<div class="obj corr"><span><b>C${i+1}. ${o.type}</b><div class="debug">${o.debug||''}</div></span><span class="muted">${Math.round(o.conf*100)}%</span></div>`).join(''):'<div class="muted">Niciun coridor detectat.</div>'}
function detectGeometry(bin,Minv){const out=[],cs=new cv.MatVector(),hi=new cv.Mat();cv.findContours(bin,cs,hi,cv.RETR_LIST,cv.CHAIN_APPROX_SIMPLE);let id=1;for(let i=0;i<cs.size();i++){const c=cs.get(i),area=Math.abs(cv.contourArea(c)),per=cv.arcLength(c,true);if(area<180||area>bin.cols*bin.rows*.15||per<40){c.delete();continue}const ap=new cv.Mat();cv.approxPolyDP(c,ap,.025*per,true);const n=ap.rows,circ=4*Math.PI*area/Math.max(1,per*per),r=cv.boundingRect(c),rect=area/Math.max(1,r.width*r.height);let type=null,pts=null,conf=.8;if(n===3){type='Triunghi';pts=mpts(ap);conf=.93}else if(circ>.68&&n>=6&&Math.abs(r.width-r.height)/Math.max(r.width,r.height)<.35){type='Cerc';pts=[{x:r.x,y:r.y},{x:r.x+r.width,y:r.y},{x:r.x+r.width,y:r.y+r.height},{x:r.x,y:r.y+r.height}];conf=.88}else if(n>=4&&n<=7&&rect>.46){type='Dreptunghi';pts=[{x:r.x,y:r.y},{x:r.x+r.width,y:r.y},{x:r.x+r.width,y:r.y+r.height},{x:r.x,y:r.y+r.height}];conf=.86}if(type){drawPath(pts.map(p=>project(p.x,p.y,Minv)),'G'+id,'#00ff9d',true);out.push({type,conf});id++}ap.delete();c.delete();if(out.length>=20)break}cs.delete();hi.delete();return out}
function bandScore(mat,kind){const w=mat.cols,h=mat.rows,bins=18,half=9;let hit=0;for(let i=0;i<bins;i++){const t=.08+i*.84/(bins-1),cx=t*(w-1),cy=kind==='d1'?t*(h-1):(1-t)*(h-1);let ok=false;for(let y=Math.max(0,Math.round(cy-half));y<=Math.min(h-1,Math.round(cy+half))&&!ok;y++)for(let x=Math.max(0,Math.round(cx-half));x<=Math.min(w-1,Math.round(cx+half));x++)if(mat.ucharPtr(y,x)[0]>0){ok=true;break}if(ok)hit++}return hit/bins}
function detectMilitary(bin,Minv){const out=[],cs=new cv.MatVector(),hi=new cv.Mat();cv.findContours(bin,cs,hi,cv.RETR_LIST,cv.CHAIN_APPROX_SIMPLE);let id=1;for(let i=0;i<cs.size();i++){const c=cs.get(i),area=Math.abs(cv.contourArea(c));if(area<450||area>bin.cols*bin.rows*.12){c.delete();continue}const r=cv.boundingRect(c),ar=r.width/Math.max(1,r.height);if(r.width<35||r.height<24||ar<.8||ar>3.5){c.delete();continue}const per=cv.arcLength(c,true),ap=new cv.Mat();cv.approxPolyDP(c,ap,.04*per,true),rect=area/Math.max(1,r.width*r.height);if(ap.rows>=4&&ap.rows<=10&&rect>.38){const roi=bin.roi(new cv.Rect(r.x,r.y,r.width,r.height)),norm=new cv.Mat();cv.resize(roi,norm,new cv.Size(200,120));roi.delete();const mm=13;cv.rectangle(norm,new cv.Point(0,0),new cv.Point(norm.cols-1,mm),new cv.Scalar(0),-1);cv.rectangle(norm,new cv.Point(0,norm.rows-1-mm),new cv.Point(norm.cols-1,norm.rows-1),new cv.Scalar(0),-1);cv.rectangle(norm,new cv.Point(0,0),new cv.Point(mm,norm.rows-1),new cv.Scalar(0),-1);cv.rectangle(norm,new cv.Point(norm.cols-1-mm,0),new cv.Point(norm.cols-1,norm.rows-1),new cv.Scalar(0),-1);const d1=bandScore(norm,'d1'),d2=bandScore(norm,'d2');norm.delete();if(d1>.38&&d2>.38){const q=[{x:r.x,y:r.y},{x:r.x+r.width,y:r.y},{x:r.x+r.width,y:r.y+r.height},{x:r.x,y:r.y+r.height}];drawPath(q.map(p=>project(p.x,p.y,Minv)),'M'+id,'#ff4fd8',true);out.push({type:'Infanterie',conf:Math.min(.97,.62+.18*Math.min(d1,d2)+.15*rect),debug:`d1=${d1.toFixed(2)} · d2=${d2.toFixed(2)} · rect=${rect.toFixed(2)}`});id++}}ap.delete();c.delete()}cs.delete();hi.delete();return out}
function angleAt(a,b,c){const v1={x:a.x-b.x,y:a.y-b.y},v2={x:c.x-b.x,y:c.y-b.y},n1=Math.hypot(v1.x,v1.y),n2=Math.hypot(v2.x,v2.y);if(n1<1||n2<1)return 180;let d=(v1.x*v2.x+v1.y*v2.y)/(n1*n2);d=Math.max(-1,Math.min(1,d));return Math.acos(d)*180/Math.PI}
function arrowShapeScore(pts,closed,targetSegments){const n=pts.length;if(n<5)return null;let tipIdx=-1,minAngle=180;for(let i=0;i<n;i++){const prev=pts[(i-1+n)%n],cur=pts[i],next=pts[(i+1)%n],a=angleAt(prev,cur,next);if(a<minAngle){minAngle=a;tipIdx=i}}if(tipIdx<0||minAngle>78)return null;const tip=pts[tipIdx],r={minX:Math.min(...pts.map(p=>p.x)),maxX:Math.max(...pts.map(p=>p.x)),minY:Math.min(...pts.map(p=>p.y)),maxY:Math.max(...pts.map(p=>p.y))};const span=Math.hypot(r.maxX-r.minX,r.maxY-r.minY),far=Math.max(...pts.map(p=>dist(p,tip)));if(span<35||far<span*.45)return null;let segmentScore=Math.max(0,1-Math.abs(n-targetSegments)/2),sharpScore=Math.max(0,1-minAngle/90),elong=Math.min(1,far/Math.max(1,span));const score=.50*segmentScore+.35*sharpScore+.15*elong;return {score,tipIdx,minAngle,segmentScore}}
function detectCorridors(bin,Minv){const out=[],cs=new cv.MatVector(),hi=new cv.Mat();cv.findContours(bin,cs,hi,cv.RETR_LIST,cv.CHAIN_APPROX_NONE);const cand=[];for(let i=0;i<cs.size();i++){const c=cs.get(i),area=Math.abs(cv.contourArea(c)),per=cv.arcLength(c,true),r=cv.boundingRect(c);if(per<70||per>900||r.width<28||r.height<18||area>bin.cols*bin.rows*.18){c.delete();continue}for(const eps of [.016,.022,.030,.040,.052]){const ap=new cv.Mat();cv.approxPolyDP(c,ap,eps*per,true);const pts=mpts(ap),n=pts.length;if(n>=5&&n<=8){const closedArea=area>160,closed=closedArea,target=closed?7:6,sh=arrowShapeScore(pts,closed,target);if(sh&&sh.score>.48){cand.push({pts,n,closed,score:sh.score,minAngle:sh.minAngle,r});ap.delete();break}}ap.delete()}c.delete()}cs.delete();hi.delete();const uniq=[];for(const c of cand.sort((a,b)=>b.score-a.score)){const cx=c.r.x+c.r.width/2,cy=c.r.y+c.r.height/2;if(uniq.some(u=>Math.hypot(cx-(u.r.x+u.r.width/2),cy-(u.r.y+u.r.height/2))<24))continue;uniq.push(c);if(uniq.length>=8)break}let id=1;for(const c of uniq){const p=c.pts.map(x=>project(x.x,x.y,Minv));drawPath(p,'C'+id,'#4da3ff',c.closed);const exact=(c.closed&&c.n===7)||(!c.closed&&c.n===6);out.push({type:'Culoar de atac / deplasare',conf:Math.min(.96,.62+c.score*.30+(exact?.04:0)),debug:`${c.n} segmente · ${c.closed?'poligon închis':'polilinie deschisă'} · vârf=${Math.round(c.minAngle)}°`});id++}return out}
function detect(){if(!running||busy||!cvReady||video.readyState<2)return;busy=true;const W=work.width,H=work.height;wctx.save();if(facing==='user'){wctx.translate(W,0);wctx.scale(-1,1)}wctx.drawImage(video,0,0,W,H);wctx.restore();let src,gray,blur,edges;try{src=cv.imread(work);gray=new cv.Mat();blur=new cv.Mat();edges=new cv.Mat();cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);cv.GaussianBlur(gray,blur,new cv.Size(5,5),0);cv.Canny(blur,edges,35,120);const p=findPaper(gray,edges,W,H);octx.clearRect(0,0,W,H);if(!p){app.classList.remove('paper-ok');statusEl.textContent=cname()+' — caut foaia A4…';renderAll([],[],[]);return}app.classList.add('paper-ok');drawPath(p.q,'A4','#55c7ff',true);const portrait=(dist(p.q[0],p.q[1])+dist(p.q[3],p.q[2]))<(dist(p.q[0],p.q[3])+dist(p.q[1],p.q[2]));const PW=portrait?420:594,PH=portrait?594:420,sp=cv.matFromArray(4,1,cv.CV_32FC2,[p.q[0].x,p.q[0].y,p.q[1].x,p.q[1].y,p.q[2].x,p.q[2].y,p.q[3].x,p.q[3].y]),dp=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,PW-1,0,PW-1,PH-1,0,PH-1]),M=cv.getPerspectiveTransform(sp,dp),Minv=cv.getPerspectiveTransform(dp,sp),paperGray=new cv.Mat();cv.warpPerspective(gray,paperGray,M,new cv.Size(PW,PH));const clahe=new cv.CLAHE(2.0,new cv.Size(8,8)),enh=new cv.Mat();clahe.apply(paperGray,enh);clahe.delete();const bin=new cv.Mat();cv.adaptiveThreshold(enh,bin,255,cv.ADAPTIVE_THRESH_GAUSSIAN_C,cv.THRESH_BINARY_INV,35,11);const k=cv.getStructuringElement(cv.MORPH_ELLIPSE,new cv.Size(3,3));cv.morphologyEx(bin,bin,cv.MORPH_CLOSE,k);k.delete();cv.rectangle(bin,new cv.Point(0,0),new cv.Point(PW-1,PH-1),new cv.Scalar(0),12);const g=detectGeometry(bin,Minv),m=detectMilitary(bin,Minv),c=detectCorridors(bin,Minv);renderAll(g,m,c);statusEl.textContent=`${cname()} — A4 (${p.method}) · ${g.length} forme · ${m.length} simboluri · ${c.length} coridoare`;[sp,dp,M,Minv,paperGray,enh,bin].forEach(x=>x.delete())}catch(e){console.error(e);statusEl.textContent='Eroare detecție: '+e.message}finally{[src,gray,blur,edges].forEach(x=>{try{if(x)x.delete()}catch{}});busy=false}}
function loop(t){if(!running)return;if(t-lastRun>450){lastRun=t;detect()}requestAnimationFrame(loop)}
</script></body></html>
