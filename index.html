<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>View3D – Paper AR</title>
<style>
html,body{margin:0;height:100%;background:#07090d;color:#fff;font-family:system-ui,Segoe UI,sans-serif}
body{overflow:auto}.app{max-width:720px;margin:auto;padding:12px;box-sizing:border-box}.top{position:sticky;top:0;z-index:5;background:rgba(7,9,13,.92);backdrop-filter:blur(8px);padding:6px 0 10px}.title{display:flex;align-items:center;justify-content:space-between;gap:12px}.title h1{font-size:20px;margin:0}.status{font-size:13px;margin:6px 0;color:#d9e2ef}.controls{display:flex;gap:8px;flex-wrap:wrap}button{padding:10px 13px;border:0;border-radius:11px;font-weight:700}.stage{position:relative;width:100%;aspect-ratio:3/4;background:#111;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px #0008}.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%}video{object-fit:fill;background:#111}#overlay{pointer-events:none}.mirror{transform:scaleX(-1)}.hint{position:absolute;left:50%;top:50%;width:72%;height:72%;transform:translate(-50%,-50%);border:2px dashed #ffffff99;border-radius:12px;pointer-events:none}.panel{margin-top:12px;background:#121722;border:1px solid #ffffff18;border-radius:14px;padding:12px}.panel h2{font-size:16px;margin:0 0 8px}.objects{display:grid;gap:7px}.obj{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;background:#0b0f16;border-radius:9px;font-size:13px}.badge{font-weight:700}.muted{opacity:.7}.paper-ok .hint{display:none}.legend{font-size:12px;line-height:1.45;opacity:.75;margin-top:8px}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <div class="title"><h1>View3D · Paper AR</h1><span id="fps" class="muted"></span></div>
    <div class="status" id="status">Se încarcă motorul de viziune…</div>
    <div class="controls"><button id="start" disabled>Pornește camera</button><button id="switch" disabled>Schimbă camera</button></div>
  </div>
  <div class="stage" id="stage">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
    <div class="hint"> </div>
  </div>
  <canvas id="work" hidden></canvas>
  <div class="panel">
    <h2>Obiecte identificate <span id="count" class="muted">(0)</span></h2>
    <div id="objects" class="objects"><div class="muted">Niciun obiect detectat.</div></div>
    <div class="legend">Detecția este optimizată pentru o foaie A4 albă, cu desene închise la culoare. Sunt căutate: linii, triunghiuri, patrulatere, poligoane și cercuri. Rezultatele sunt estimări vizuale.</div>
  </div>
</div>
<script async src="https://docs.opencv.org/4.x/opencv.js" onload="opencvLoaded()"></script>
<script>
const video=document.getElementById('video'), overlay=document.getElementById('overlay'), octx=overlay.getContext('2d'), work=document.getElementById('work'), wctx=work.getContext('2d',{willReadFrequently:true});
const startBtn=document.getElementById('start'), switchBtn=document.getElementById('switch'), statusEl=document.getElementById('status'), objectsEl=document.getElementById('objects'), countEl=document.getElementById('count'), app=document.getElementById('app'), stage=document.getElementById('stage');
let stream=null,running=false,facing='environment',cvReady=false,busy=false,lastRun=0,lastObjects=[];
function opencvLoaded(){const ready=()=>{if(window.cv&&cv.Mat){cvReady=true;startBtn.disabled=false;statusEl.textContent='Pregătit. Îndreaptă camera spre o foaie A4.'}else setTimeout(ready,100)};ready()}
function cameraName(){return facing==='environment'?'Camera principală':'Camera frontală'}
async function openCamera(){if(!cvReady)return;stopTracks();try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}}});video.srcObject=stream;video.classList.toggle('mirror',facing==='user');await video.play();running=true;startBtn.textContent='Oprește';switchBtn.disabled=false;resizeCanvases();statusEl.textContent=cameraName()+' — caut foaia A4…';requestAnimationFrame(loop)}catch(e){statusEl.textContent='Eroare cameră: '+e.message}}
function stopTracks(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null}
function stopCamera(){running=false;stopTracks();video.srcObject=null;switchBtn.disabled=true;startBtn.textContent='Pornește camera';statusEl.textContent='Camera oprită';octx.clearRect(0,0,overlay.width,overlay.height);app.classList.remove('paper-ok');renderList([])}
startBtn.onclick=()=>running?stopCamera():openCamera();
switchBtn.onclick=async()=>{facing=facing==='environment'?'user':'environment';await openCamera()};
function resizeCanvases(){const vw=video.videoWidth||720,vh=video.videoHeight||1280;stage.style.aspectRatio=vw+'/'+vh;overlay.width=work.width=vw;overlay.height=work.height=vh}
window.addEventListener('resize',()=>{if(running)resizeCanvases()});
function orderQuad(pts){const s=pts.map(p=>p.x+p.y),d=pts.map(p=>p.x-p.y);return [pts[s.indexOf(Math.min(...s))],pts[d.indexOf(Math.max(...d))],pts[s.indexOf(Math.max(...s))],pts[d.indexOf(Math.min(...d))]]}
function matPointArray(m){const a=[];for(let i=0;i<m.rows;i++)a.push({x:m.intAt(i,0),y:m.intAt(i,1)});return a}
function projectPoint(x,y,H){const src=cv.matFromArray(1,1,cv.CV_32FC2,[x,y]),dst=new cv.Mat();cv.perspectiveTransform(src,dst,H);const p={x:dst.floatAt(0,0),y:dst.floatAt(0,1)};src.delete();dst.delete();return p}
function drawPoly(points,label,stroke='#00ff9d'){if(!points.length)return;octx.save();octx.strokeStyle=stroke;octx.fillStyle=stroke;octx.lineWidth=Math.max(2,overlay.width/360);octx.beginPath();octx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)octx.lineTo(points[i].x,points[i].y);octx.closePath();octx.stroke();if(label){const p=points[0];octx.font=Math.max(13,overlay.width/45)+'px system-ui';octx.fillText(label,p.x+5,p.y-7)}octx.restore()}
function drawLine(a,b,label){octx.save();octx.strokeStyle='#ffd84d';octx.fillStyle='#ffd84d';octx.lineWidth=Math.max(2,overlay.width/400);octx.beginPath();octx.moveTo(a.x,a.y);octx.lineTo(b.x,b.y);octx.stroke();if(label){octx.font=Math.max(12,overlay.width/50)+'px system-ui';octx.fillText(label,(a.x+b.x)/2+4,(a.y+b.y)/2-4)}octx.restore()}
function renderList(items){lastObjects=items;countEl.textContent='('+items.length+')';if(!items.length){objectsEl.innerHTML='<div class="muted">Niciun obiect detectat.</div>';return}objectsEl.innerHTML=items.map((o,i)=>`<div class="obj"><span><span class="badge">${i+1}. ${o.type}</span>${o.detail?' · '+o.detail:''}</span><span class="muted">${Math.round(o.conf*100)}%</span></div>`).join('')}
function dedupeLines(lines){const out=[];for(const l of lines){const mx=(l.x1+l.x2)/2,my=(l.y1+l.y2)/2,ang=Math.atan2(l.y2-l.y1,l.x2-l.x1);let dup=false;for(const q of out){const qmx=(q.x1+q.x2)/2,qmy=(q.y1+q.y2)/2,qang=Math.atan2(q.y2-q.y1,q.x2-q.x1);let da=Math.abs(ang-qang);da=Math.min(da,Math.PI-da);if(Math.hypot(mx-qmx,my-qmy)<28&&da<0.12){dup=true;break}}if(!dup)out.push(l);if(out.length>=10)break}return out}
function detect(){if(!running||busy||!cvReady||video.readyState<2)return;busy=true;const W=work.width,H=work.height;wctx.save();if(facing==='user'){wctx.translate(W,0);wctx.scale(-1,1)}wctx.drawImage(video,0,0,W,H);wctx.restore();let src=null,gray=null,blur=null,edges=null,contours=null,hierarchy=null;try{
src=cv.imread(work);gray=new cv.Mat();blur=new cv.Mat();edges=new cv.Mat();cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);cv.GaussianBlur(gray,blur,new cv.Size(5,5),0);cv.Canny(blur,edges,55,150);contours=new cv.MatVector();hierarchy=new cv.Mat();cv.findContours(edges,contours,hierarchy,cv.RETR_LIST,cv.CHAIN_APPROX_SIMPLE);
let best=null,bestArea=0;for(let i=0;i<contours.size();i++){const c=contours.get(i),area=Math.abs(cv.contourArea(c));if(area>W*H*.12&&area< W*H*.98){const peri=cv.arcLength(c,true),ap=new cv.Mat();cv.approxPolyDP(c,ap,.02*peri,true);if(ap.rows===4&&cv.isContourConvex(ap)&&area>bestArea){const pts=matPointArray(ap),ord=orderQuad(pts);const sides=[Math.hypot(ord[1].x-ord[0].x,ord[1].y-ord[0].y),Math.hypot(ord[2].x-ord[1].x,ord[2].y-ord[1].y),Math.hypot(ord[3].x-ord[2].x,ord[3].y-ord[2].y),Math.hypot(ord[0].x-ord[3].x,ord[0].y-ord[3].y)];const ratio=Math.max((sides[0]+sides[2])/(sides[1]+sides[3]),(sides[1]+sides[3])/(sides[0]+sides[2]));if(ratio>1.15&&ratio<1.8){best={pts:ord};bestArea=area}}ap.delete()}c.delete()}
octx.clearRect(0,0,W,H);if(!best){app.classList.remove('paper-ok');statusEl.textContent=cameraName()+' — caut foaia A4…';renderList([]);return}
app.classList.add('paper-ok');drawPoly(best.pts,'A4','#55c7ff');const PW=420,PH=594;const p=best.pts,srcPts=cv.matFromArray(4,1,cv.CV_32FC2,[p[0].x,p[0].y,p[1].x,p[1].y,p[2].x,p[2].y,p[3].x,p[3].y]),dstPts=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,PW,0,PW,PH,0,PH]);const M=cv.getPerspectiveTransform(srcPts,dstPts),Minv=cv.getPerspectiveTransform(dstPts,srcPts);const paper=new cv.Mat();cv.warpPerspective(gray,paper,M,new cv.Size(PW,PH));const bin=new cv.Mat();cv.adaptiveThreshold(paper,bin,255,cv.ADAPTIVE_THRESH_GAUSSIAN_C,cv.THRESH_BINARY_INV,31,12);const margin=12;cv.rectangle(bin,new cv.Point(0,0),new cv.Point(PW-1,PH-1),new cv.Scalar(0),margin);
const cs=new cv.MatVector(),hi=new cv.Mat();cv.findContours(bin,cs,hi,cv.RETR_EXTERNAL,cv.CHAIN_APPROX_SIMPLE);const objects=[];let id=1;for(let i=0;i<cs.size();i++){const c=cs.get(i),area=Math.abs(cv.contourArea(c));if(area<180||area>PW*PH*.35){c.delete();continue}const peri=cv.arcLength(c,true);if(peri<45){c.delete();continue}const ap=new cv.Mat();cv.approxPolyDP(c,ap,.025*peri,true);const vtx=ap.rows,rect=cv.boundingRect(c),circularity=4*Math.PI*area/(peri*peri);let type=null,conf=.72;if(circularity>.78&&vtx>=6){type='Cerc / elipsă';conf=Math.min(.98,.72+circularity*.2)}else if(vtx===3){type='Triunghi';conf=.92}else if(vtx===4){type='Patrulater';conf=.90}else if(vtx>=5&&vtx<=10){type='Poligon '+vtx+' laturi';conf=.82}if(type){const pts=matPointArray(ap).map(q=>projectPoint(q.x,q.y,Minv));drawPoly(pts,String(id));objects.push({type,detail:`arie ~${Math.round(area)} px²`,conf});id++}ap.delete();c.delete();if(objects.length>=12)break}
const linesMat=new cv.Mat();cv.HoughLinesP(bin,linesMat,1,Math.PI/180,55,45,18);let lines=[];for(let i=0;i<linesMat.rows;i++){const x1=linesMat.intPtr(i,0)[0],y1=linesMat.intPtr(i,0)[1],x2=linesMat.intPtr(i,0)[2],y2=linesMat.intPtr(i,0)[3],len=Math.hypot(x2-x1,y2-y1);if(len>55)lines.push({x1,y1,x2,y2,len})}lines.sort((a,b)=>b.len-a.len);lines=dedupeLines(lines);for(const l of lines){const a=projectPoint(l.x1,l.y1,Minv),b=projectPoint(l.x2,l.y2,Minv);drawLine(a,b,String(id));objects.push({type:'Linie',detail:`lungime ~${Math.round(l.len)} px`,conf:.78});id++;if(objects.length>=20)break}
statusEl.textContent=cameraName()+` — A4 detectat · ${objects.length} obiecte`;renderList(objects);linesMat.delete();cs.delete();hi.delete();bin.delete();paper.delete();M.delete();Minv.delete();srcPts.delete();dstPts.delete();
}catch(e){console.error(e);statusEl.textContent='Eroare detecție: '+e.message}finally{[src,gray,blur,edges,contours,hierarchy].forEach(m=>{try{if(m)m.delete()}catch{}});busy=false}}
function loop(t){if(!running)return;if(t-lastRun>350){lastRun=t;detect()}requestAnimationFrame(loop)}
</script>
</body>
</html>
